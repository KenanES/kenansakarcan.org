name: Update prices

on:
  schedule:
    - cron: "30 22 * * 1-5"   # weekdays after the US close
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_prices.py
      - name: Commit new prices
        run: |
          git config user.name "price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add investments/prices.json
          git diff --cached --quiet || (git commit -m "Update stock prices" && git push)
