<style>
/* Layout: one quiet 432px text column, small type, hairline-divided rows with a muted left label column. */
:root {

  --line: #EDEDEC;

:root[data-theme="dark"] {
  --bg: #111111; --fg: #EDEDED; --muted: #7D7D7D; --line: #222222; --underline: #444444; --ph: #1B1B1B;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 14px;

.page {

  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid;
  gap: 48px;
}
p { margin: 0; }
a { color: var(--fg); text-decoration: none; }
.prose a { border-bottom: 1px solid var(--underline); transition: border-color .15s; }
.prose a:hover { border-color: var(--fg); }
a:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; border-radius: 2px; }
.muted { color: var(--muted); }

/* Header */
header { display: flex; align-items: center; gap: 12px; }

.clock {
  margin-left: auto; display: inline-flex; align-items: center; gap: 6px;
  font-variant-numeric: tabular-nums; white-space: nowrap;

.clock svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

.analog .hand-m { stroke-width: 1.3; }
.analog .hand-s { stroke: #D2462D; stroke-width: .6; }
.analog .cap { fill: currentColor; stroke: none; }
@media (max-width: 400px) { .clock { margin-left: 0; } }
.name-line { display: flex; align-items: center; gap: 2px; }
.throw-btn {
  display: inline-grid; place-items: center; width: 22px; height: 22px; margin: -1px 0;
  padding: 0; border: 0; border-radius: 6px; background: transparent; color: var(--muted); cursor: pointer;
  transition: color .15s, background .15s, transform .2s;
}
.throw-btn:hover { color: var(--fg); background: var(--ph); transform: translate(1px, -1px); }
.throw-btn:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.throw-btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linejoin: round; stroke-linecap: round; }
.row .title { display: inline-flex; align-items: center; gap: 8px; }
.ico { display: inline-grid; place-items: center; width: 22px; height: 16px; flex: none; }
.ico svg { width: 16px; height: 16px; }
.ico .solid { fill: currentColor; }
.ico .line { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.prose { display: grid; gap: 12px; }

/* Section label + rows */
.label { color: var(--muted); font-weight: 460; font-size: 14px; margin: 0 0 8px; }
.rows { list-style: none; margin: 0; padding: 0; }
.row {

a.row:hover .title { color: var(--muted); }

/* Photo carousel: swipeable strip that snaps to each photo, with the next one peeking in */
.page { grid-template-columns: minmax(0, 1fr); }
/* Text stays in the narrow column; only the photo section uses the full page width */
.page > * { width: 100%; max-width: 432px; justify-self: center; }

.carousel-nav button:focus-visible, .carousel:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.carousel {

  overflow-x: auto; scroll-snap-type: x mandatory;

.carousel::-webkit-scrollbar { display: none; }

/* Each photo fills a large frame as far as its proportions allow, so nothing is cropped */

  display: block; border-radius: 6px; background: var(--ph);
}

  <script>
    (function () {
      var track = document.getElementById('carousel');
      var prev = document.getElementById('carousel-prev');
      var next = document.getElementById('carousel-next');
      function target(dir) {
        var slides = Array.prototype.slice.call(track.children);
        var x = track.scrollLeft;
        var max = track.scrollWidth - track.clientWidth;
        /* Past either end, wrap around to the other end */
        if (dir > 0 && x >= max - 1) return 0;
        if (dir < 0 && x <= 1) return max;
        var hit = dir > 0
          ? slides.filter(function (s) { return s.offsetLeft > x + 1; })[0]
          : slides.filter(function (s) { return s.offsetLeft < x - 1; }).pop();
        return hit ? hit.offsetLeft : x;
      }
      function move(dir) {
        track.scrollTo({ left: target(dir), behavior: 'auto' });
      }
      /* The barn video loops while it is on screen and pauses once scrolled away */
      var vid = document.getElementById('barn-video');
      if (vid) {
        var still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (still) { vid.removeAttribute('autoplay'); vid.pause(); }
        var play = function () { var p = vid.play(); if (p && p.catch) p.catch(function () {}); };
        if ('IntersectionObserver' in window) {
          new IntersectionObserver(function (entries) {
            entries.forEach(function (e) {
              if (e.isIntersecting && e.intersectionRatio >= 0.25) { if (!still) play(); }
              else if (!e.isIntersecting) vid.pause();
            });
          }, { threshold: [0, 0.25] }).observe(vid);
        }
        vid.addEventListener('click', function () { if (vid.paused) play(); else vid.pause(); });
      }
      prev.addEventListener('click', function () { move(-1); });
      next.addEventListener('click', function () { move(1); });
      track.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowLeft') { e.preventDefault(); move(-1); }
        if (e.key === 'ArrowRight') { e.preventDefault(); move(1); }
      });
    })();
  </script>

<style>
  .throw { position: fixed; inset: 0; pointer-events: none; z-index: 50; overflow: hidden; }

<script>
  (function () {
    var root = document.getElementById('throw');
    var hand = document.getElementById('throw-hand');
    var held = document.getElementById('plane-held');
    var fly = document.getElementById('plane-fly');
    var path = document.getElementById('throw-path');
    var trail = document.getElementById('throw-trail');
    var btn = document.getElementById('throw-btn');
    if (!root || !hand.animate || !path.getPointAtLength) { if (btn) btn.hidden = true; return; }
    var busy = false;

    function throwPlane() {
    if (busy) return;
    busy = true;
    /* reset from any earlier throw */
    hand.getAnimations().forEach(function (a) { a.cancel(); });
    held.removeAttribute('visibility');
    fly.setAttribute('visibility', 'hidden');
    trail.setAttribute('d', '');
    trail.style.opacity = '';
    Array.prototype.forEach.call(hand.querySelectorAll('.draw'), function (el) {
      el.classList.remove('draw'); void el.getBoundingClientRect(); el.classList.add('draw');
    });
    root.hidden = false;

    /* 1. Hand reaches in, cocks back, then snaps forward */
    var windup = 1100, releaseAt = 790;
    hand.animate([
      { transform: 'translateX(-75%) rotate(4deg)', opacity: 0 },
      { transform: 'translateX(0) rotate(3deg)', opacity: 1, offset: .38 },
      { transform: 'translateX(-3%) rotate(11deg)', opacity: 1, offset: .58 },
      { transform: 'translateX(6%) rotate(-13deg)', opacity: 1, offset: .76 },
      { transform: 'translateX(6%) rotate(-11deg)', opacity: 1 }
    ], { duration: windup, easing: 'cubic-bezier(.3,.6,.3,1)', fill: 'forwards' });

    /* 2. Let go: the plane leaves the fingertips and flies across the page */
    setTimeout(function () {
      var box = held.getBoundingClientRect();
      var x0 = box.left + box.width / 2, y0 = box.top + box.height / 2;
      held.setAttribute('visibility', 'hidden');
      var w = window.innerWidth, h = window.innerHeight;
      path.setAttribute('d',
        'M ' + x0 + ' ' + y0 +
        ' C ' + (x0 + w * .2) + ' ' + Math.max(16, y0 - h * .14) + ', ' + (w * .4) + ' ' + (y0 + h * .02) + ', ' + (w * .55) + ' ' + (y0 + h * .1) +
        ' S ' + (w * .82) + ' ' + (y0 + h * .24) + ', ' + (w + 140) + ' ' + Math.max(20, y0 - h * .08));
      var L = path.getTotalLength();
      var dur = Math.min(3200, Math.max(2200, L * 1.6));
      var scale = w < 600 ? 1 : 1.35;
      var pts = [];
      var start = performance.now();
      fly.setAttribute('visibility', 'visible');
      function frame(now) {
        var t = Math.min(1, (now - start) / dur);
        var e = 1 - Math.pow(1 - t, 1.7);
        var s = e * L;
        var p = path.getPointAtLength(s);
        var q = path.getPointAtLength(Math.min(L, s + 2));
        var ang = Math.atan2(q.y - p.y, q.x - p.x) * 180 / Math.PI + Math.sin(t * 14) * 4 * (1 - t);
        fly.setAttribute('transform', 'translate(' + p.x + ' ' + p.y + ') rotate(' + ang + ') scale(' + scale + ')');
        pts.push(p.x.toFixed(1) + ' ' + p.y.toFixed(1));
        trail.setAttribute('d', 'M ' + pts.join(' L '));
        if (t < 1) requestAnimationFrame(frame);
        else {
          trail.style.opacity = '0';
          setTimeout(function () { root.hidden = true; busy = false; }, 700);
        }
      }
      requestAnimationFrame(frame);
    }, releaseAt);

    /* 3. Hand drops back out of view */
    setTimeout(function () {
      hand.animate([
        { transform: 'translateX(6%) rotate(-11deg)', opacity: 1 },
        { transform: 'translateX(-80%) rotate(4deg)', opacity: 0 }
      ], { duration: 650, easing: 'ease-in', fill: 'forwards' });
    }, windup + 450);
    }

    /* The paper plane button throws again any time */
    if (btn) btn.addEventListener('click', throwPlane);

    /* Automatic throw: once per visit, skipped for reduced motion unless ?throw is in the address */
    var replay = /[?&]throw\b/.test(location.search);
    if (!replay && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    try {
      if (!replay && sessionStorage.getItem('plane-thrown')) return;
      sessionStorage.setItem('plane-thrown', '1');
    } catch (e) {}
    throwPlane();
  })();
</script>
