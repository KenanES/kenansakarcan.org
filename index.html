<!doctype html>
<html lang="en">
<head>

<meta name="description" content="Kenan Sakarcan">
<style>

img { max-width: 100%; }
</style>
<title>Kenan Sakarcan</title>

<style>
/* Layout: one quiet 432px text column, small type, hairline-divided rows with a muted left label column. */
:root {
  --bg: #FCFCFB;
  --fg: #111111;
  --muted: #8F8F8F;
  --line: #EDEDEC;
  --underline: #CFCFCD;
  --ph: #F1F1EF;
  --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111111; --fg: #EDEDED; --muted: #7D7D7D; --line: #222222; --underline: #444444; --ph: #1B1B1B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111111; --fg: #EDEDED; --muted: #7D7D7D; --line: #222222; --underline: #444444; --ph: #1B1B1B;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 14px;
  line-height: 20px;
  font-weight: 460;
  letter-spacing: -0.09px;
  font-feature-settings: "cv11", "ss01";
  -webkit-font-smoothing: antialiased;
}
.page {
  max-width: calc(1200px + 32px);
  margin: 0 auto;
  padding-block: 64px 96px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid;
  gap: 48px;
}
p { margin: 0; }
a { color: var(--fg); text-decoration: none; }
.prose a { border-bottom: 1px solid var(--underline); transition: border-color .15s; }
.prose a:hover { border-color: var(--fg); }
a:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; border-radius: 2px; }
.muted { color: var(--muted); }

/* Header */
header { display: flex; align-items: center; gap: 12px; }
.avatar {
  width: 40px; height: 40px; border-radius: 50%; flex: none;
  background: var(--ph); color: var(--muted);
  display: grid; place-items: center; font-size: 12px; overflow: hidden;
}
header { flex-wrap: wrap; }
.clock {
  margin-left: auto; display: inline-flex; align-items: center; gap: 6px;
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.clock svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
@media (max-width: 400px) { .clock { margin-left: 52px; } }
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.prose { display: grid; gap: 12px; }

/* Section label + rows */
.label { color: var(--muted); font-weight: 460; font-size: 14px; margin: 0 0 8px; }
.rows { list-style: none; margin: 0; padding: 0; }
.row {
  display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: baseline;
  padding: 6px 0; border-top: 1px solid var(--line);
}
.row:first-child { border-top: 0; }
.row .title { min-width: 0; }
.row .meta { color: var(--muted); font-variant-numeric: tabular-nums; }
a.row:hover .title { color: var(--muted); }

/* Photo carousel: swipeable strip that snaps to each photo, with the next one peeking in */
.page { grid-template-columns: minmax(0, 1fr); }
/* Text stays in the narrow column; only the photo section uses the full page width */
.page > * { width: 100%; max-width: 432px; justify-self: center; }
.page > .gallery { max-width: none; }
.carousel-head { display: flex; align-items: center; justify-content: flex-end; margin: 0 0 8px; }
.carousel-head .label { margin: 0; }
.carousel-nav { display: flex; gap: 2px; }
.carousel-nav button {
  width: 28px; height: 28px; padding: 0; border: 0; border-radius: 6px;
  background: transparent; color: var(--fg); font: inherit; cursor: pointer;
  transition: background .15s;
}
.carousel-nav button:hover:not(:disabled) { background: var(--ph); }
.carousel-nav button:disabled { color: var(--muted); opacity: .5; cursor: default; }
.carousel-nav button:focus-visible, .carousel:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.carousel {
  display: flex; gap: 8px; align-items: center;
  overflow-x: auto; scroll-snap-type: x mandatory;
  scrollbar-width: none; border-radius: 6px;
}
.carousel::-webkit-scrollbar { display: none; }
.carousel { position: relative; }
/* Each photo fills a large frame as far as its proportions allow, so nothing is cropped */
.slide { margin: 0; flex: 0 0 auto; scroll-snap-align: start; }
.slide img, .slide video {
  width: auto; height: auto;
  max-height: min(680px, 78vh);
  max-width: min(1200px, calc(100vw - 32px));
  display: block; border-radius: 6px; background: var(--ph);
}

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<main class="page">
  <header>
    <div class="avatar"><img src="photos/portrait.jpg" width="240" height="240" alt="Kenan Sakarcan ski touring"></div>
    <div>
      <div>Kenan Sakarcan</div>
      <div class="muted">Updated Nov 11, 2026</div>
    </div>
    <div class="clock muted" aria-live="off">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.25"/><path d="M8 4.75V8l2.25 1.5"/></svg>
      <span><time id="clock-time">--:--</time> <span id="clock-tz">PST</span> in Seattle, WA</span>
    </div>
  </header>
  <script>
    (function () {
      var t = document.getElementById('clock-time'), z = document.getElementById('clock-tz');
      function tick() {
        var now = new Date();
        var parts = new Intl.DateTimeFormat('en-US', { timeZone: 'America/Los_Angeles', hour: 'numeric', minute: '2-digit', timeZoneName: 'short' }).formatToParts(now);
        var get = function (k) { var p = parts.find(function (x) { return x.type === k; }); return p ? p.value : ''; };
        t.textContent = get('hour') + ':' + get('minute') + ' ' + get('dayPeriod');
        z.textContent = get('timeZoneName') || 'PST';
      }
      tick();
      setInterval(tick, 15000);
    })();
  </script>

  <section aria-labelledby="links-h">
    <h2 class="label" id="links-h">Links</h2>
    <div class="rows">
      <a class="row" href="https://www.linkedin.com/in/kenansakarcan/" target="_blank" rel="noopener"><span class="title">LinkedIn</span></a>
      <a class="row" href="https://www.joinleland.com/kenansakarcangmailcom-kenansakarcangmailcom" target="_blank" rel="noopener"><span class="title">Coaching - 10+ 5 star reviews and counting</span></a>
      <a class="row" href="favorites/"><span class="title">Favorites</span></a>
    </div>
  </section>

  <section class="gallery" aria-label="Photo gallery">
    <div class="carousel-head">
      <div class="carousel-nav">
        <button type="button" id="carousel-prev" aria-label="Previous photo">&larr;</button>
        <button type="button" id="carousel-next" aria-label="Next photo">&rarr;</button>
      </div>
    </div>
    <div class="carousel" id="carousel" tabindex="0" role="group" aria-label="Photo carousel">
      <figure class="slide"><video id="barn-video" src="photos/barn.mp4" poster="photos/barn.jpg" width="720" height="1280" autoplay muted loop playsinline preload="auto" aria-label="Red barn under heavy falling snow"></video></figure>
      <figure class="slide"><img src="photos/bike.jpg" width="768" height="1024" alt="Shadow of a person riding a bike, cast on a bright green hillside"></figure>
      <figure class="slide"><img src="photos/hills.jpg" width="1400" height="1050" alt="Green coastal hills in evening light, with a city and the ocean on the horizon"></figure>
      <figure class="slide"><img src="photos/horses.jpg" width="1400" height="1304" loading="lazy" alt="Horses running through a golden meadow past a gnarled tree, with rocky mountains behind"></figure>
      <figure class="slide"><img src="photos/rainier.jpg" width="1050" height="1400" loading="lazy" alt="Snow-covered volcano across a calm lake under a pink and orange sunset"></figure>
      <figure class="slide"><img src="photos/peaks.jpg" width="1400" height="1050" loading="lazy" alt="Jagged snow-covered peaks under broken clouds"></figure>
      <figure class="slide"><img src="photos/ship.jpg" width="1400" height="1050" loading="lazy" alt="Cargo ship on calm water at sunset, seen past a silhouetted tree"></figure>
      <figure class="slide"><img src="photos/climb.jpg" width="1050" height="1400" loading="lazy" alt="Climber with pink skis on their pack ascending a steep snow slope beside a rock wall"></figure>
      <figure class="slide"><img src="photos/tent.jpg" width="1400" height="1050" loading="lazy" alt="Blue tent and upright skis at a snow camp below a glaciated mountain basin"></figure>
      <figure class="slide"><img src="photos/glacier.jpg" width="1400" height="933" loading="lazy" alt="Broad glacier and sharp snowy summit under a deep blue sky"></figure>
      <figure class="slide"><img src="photos/skin.jpg" width="1400" height="933" loading="lazy" alt="Ski tourer with a blue pack crossing a snowfield above a wide range of glaciated peaks"></figure>
      <figure class="slide"><img src="photos/guanaco.jpg" width="1325" height="593" loading="lazy" alt="Guanaco standing in golden grass beside a lake under a wide cloudy sky"></figure>
      <figure class="slide"><img src="photos/waterfall.jpg" width="1047" height="751" loading="lazy" alt="Waterfall over layered rock with snowy granite towers behind"></figure>
      <figure class="slide"><img src="photos/skicamp.jpg" width="1024" height="768" loading="lazy" alt="Two skiers at a snow camp below steep rocky cliffs"></figure>
      <figure class="slide"><img src="photos/gravel.jpg" width="1024" height="768" loading="lazy" alt="Gravel bike on a dirt road beside a weathered barn and autumn hills"></figure>
      <figure class="slide"><img src="photos/tourer.jpg" width="1224" height="642" loading="lazy" alt="Ski tourer with a yellow pack looking across a wide snowy basin"></figure>
      <figure class="slide"><img src="photos/valley.jpg" width="1024" height="768" loading="lazy" alt="Forested valley with a snow-dusted peak catching evening light"></figure>
      <figure class="slide"><img src="photos/summit.jpg" width="1213" height="648" loading="lazy" alt="Climber on a roped snow route at sunrise above a sea of clouds"></figure>
      <figure class="slide"><img src="photos/ski.jpg" width="787" height="1400" loading="lazy" alt="Skier in an orange jacket descending a steep snowfield, with a snow-covered volcano in the distance"></figure>
    </div>
  </section>
  <script>
    (function () {
      var track = document.getElementById('carousel');
      var prev = document.getElementById('carousel-prev');
      var next = document.getElementById('carousel-next');
      function target(dir) {
        var slides = Array.prototype.slice.call(track.children);
        var x = track.scrollLeft;
        var max = track.scrollWidth - track.clientWidth;
        /* Past either end, wrap around to the other end */
        if (dir > 0 && x >= max - 1) return 0;
        if (dir < 0 && x <= 1) return max;
        var hit = dir > 0
          ? slides.filter(function (s) { return s.offsetLeft > x + 1; })[0]
          : slides.filter(function (s) { return s.offsetLeft < x - 1; }).pop();
        return hit ? hit.offsetLeft : x;
      }
      function move(dir) {
        track.scrollTo({ left: target(dir), behavior: 'auto' });
      }
      /* The barn video loops while it is on screen and pauses once scrolled away */
      var vid = document.getElementById('barn-video');
      if (vid) {
        var still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (still) { vid.removeAttribute('autoplay'); vid.pause(); }
        var play = function () { var p = vid.play(); if (p && p.catch) p.catch(function () {}); };
        if ('IntersectionObserver' in window) {
          new IntersectionObserver(function (entries) {
            entries.forEach(function (e) {
              if (e.isIntersecting && e.intersectionRatio >= 0.25) { if (!still) play(); }
              else if (!e.isIntersecting) vid.pause();
            });
          }, { threshold: [0, 0.25] }).observe(vid);
        }
        vid.addEventListener('click', function () { if (vid.paused) play(); else vid.pause(); });
      }
      prev.addEventListener('click', function () { move(-1); });
      next.addEventListener('click', function () { move(1); });
      track.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowLeft') { e.preventDefault(); move(-1); }
        if (e.key === 'ArrowRight') { e.preventDefault(); move(1); }
      });
    })();
  </script>
</main>
